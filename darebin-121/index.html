<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CourtTrack Analytics — Darebin 12.1 (Coach)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#101d31;--navy2:#162238;--navy3:#1e3050;
  --paper:#f5f4f0;--card:#ffffff;--card2:#fafaf8;
  --ink:#17202b;--ink2:#344152;--muted:#7c8698;--subtle:#b0b8c4;
  --line:#e8e6e1;--line2:#f0eeea;
  --win:#1a9e72;--loss:#d9413f;--amber:#c87d1a;--maple:#d9a05b;
  --winbg:#eaf7f1;--lossbg:#fdeeee;--amberbg:#fef5e7;
  --windk:#0f6e50;--lossdk:#a32d2d;
  --vjbl:#2d6fb5;--vjblbg:#e8f0fb;--vjbldk:#1a4a80;
  --dom:#1a9e72;--dombg:#eaf7f1;--domdk:#0f6e50;
  --tour:#7c4dcc;--tourbg:#f0eaff;--tourdk:#5a34a0;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;}
.disp{font-family:'Barlow Condensed',sans-serif;}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.hd-inner{max-width:1140px;margin:0 auto;padding:0 24px;}
.hd-top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 0;}
.hd-logo{font-family:'Barlow Condensed';font-weight:700;font-size:24px;letter-spacing:.05em;text-transform:uppercase;line-height:1;}
.hd-logo span{color:var(--maple);}
.hd-tag{font-size:11px;color:#6a82a0;letter-spacing:.04em;margin-top:2px;}
.mode-badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:4px;letter-spacing:.05em;text-transform:uppercase;margin-left:10px;vertical-align:middle;}
.mode-badge.parent{background:rgba(217,160,91,.18);color:var(--maple);}
.mode-badge.coach{background:rgba(45,111,181,.2);color:#7ab3e8;}
.team-switcher{position:relative;}
.team-btn{background:var(--navy3);border:1px solid rgba(255,255,255,.12);color:#fff;font-family:'Barlow Condensed';font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:8px 14px 8px 16px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.admin-hub-link{background:none;border:1px solid rgba(255,255,255,.15);color:#8fa0b8;font-family:'Inter',-apple-system,sans-serif;font-size:12px;font-weight:500;padding:8px 12px;border-radius:8px;text-decoration:none;margin-right:8px;display:inline-flex;align-items:center;transition:color .15s,border-color .15s;}
.admin-hub-link:hover{color:#f1eee6;border-color:rgba(255,255,255,.3);}
.team-btn:hover{background:var(--navy2);}
.team-btn svg{width:14px;height:14px;opacity:.7;transition:transform .2s;}
.team-btn.open svg{transform:rotate(180deg);}
.team-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:var(--navy2);border:1px solid rgba(255,255,255,.12);border-radius:10px;min-width:220px;padding:6px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;}
.team-dropdown.open{display:block;}
.team-option{display:block;width:100%;background:none;border:none;color:#c8d4e4;font-family:'Barlow Condensed';font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:10px 14px;border-radius:7px;cursor:pointer;text-align:left;}
.team-option:hover,.team-option.active{background:rgba(255,255,255,.08);color:#fff;}
.team-option .team-opt-sub{font-family:'Inter';font-size:11px;font-weight:400;color:#6a82a0;display:block;text-transform:none;letter-spacing:0;margin-top:1px;}
.view-nav{display:flex;gap:2px;padding:10px 0 0;overflow-x:auto;scrollbar-width:none;}
.view-nav::-webkit-scrollbar{display:none;}
.view-tab{background:none;border:none;color:#6a82a0;font-family:'Inter';font-size:13px;font-weight:500;padding:9px 16px 10px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:color .15s;}
.view-tab:hover{color:#a8bcce;}
.view-tab.active{color:#fff;border-bottom-color:var(--maple);}
main{max-width:1140px;margin:0 auto;padding:28px 24px 80px;}
.page-hd{margin-bottom:24px;}
.page-hd-team{font-family:'Barlow Condensed';font-size:32px;font-weight:700;color:var(--ink);line-height:1;letter-spacing:.01em;}
.page-hd-meta{font-size:13px;color:var(--muted);margin-top:4px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px;}
.card-dark{background:var(--navy);border-color:transparent;border-radius:var(--radius);padding:24px 26px;margin-bottom:20px;}
.sec-h{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 16px;}
.sec-h-light{font-size:11px;font-weight:600;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;margin:0 0 16px;}
.loading,.err{padding:80px 20px;text-align:center;color:var(--muted);font-size:14px;}
.err{color:var(--loss);}
.hero-stat{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;}
.hero-n{font-family:'Barlow Condensed';font-size:72px;font-weight:700;line-height:.9;color:#fff;letter-spacing:-.01em;}
.hero-sub{color:rgba(255,255,255,.5);font-size:13px;margin-top:6px;}
.hero-meta{display:flex;gap:28px;margin-top:20px;flex-wrap:wrap;}
.hero-meta-item .v{font-family:'Barlow Condensed';font-size:28px;font-weight:600;color:var(--maple);line-height:1;}
.hero-meta-item .l{font-size:11px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.tile .v{font-family:'Barlow Condensed';font-size:38px;font-weight:700;line-height:1;color:var(--ink);}
.tile .l{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;}
.tile.t-win .v{color:var(--win);}
.tile.t-loss .v{color:var(--loss);}
.tile.t-amber .v{color:var(--amber);}
.tile.t-maple .v{color:var(--maple);}
.type-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.type-pill{font-family:'Inter';font-size:13px;font-weight:500;padding:8px 18px;border-radius:40px;border:1.5px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer;transition:all .15s;min-height:38px;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.type-pill:hover{border-color:var(--subtle);}
.type-pill.active-all{background:var(--navy);border-color:var(--navy);color:#fff;}
.type-pill.active-vjbl{background:var(--vjbl);border-color:var(--vjbl);color:#fff;}
.type-pill.active-dom{background:var(--dom);border-color:var(--dom);color:#fff;}
.type-pill.active-tour{background:var(--tour);border-color:var(--tour);color:#fff;}
.type-pill .pill-rec{font-size:12px;opacity:.8;}
.type-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:20px;}
.type-card{border-radius:var(--radius);padding:16px 18px;border:1px solid transparent;}
.type-card.tc-vjbl{background:var(--vjblbg);border-color:rgba(45,111,181,.2);}
.type-card.tc-dom{background:var(--dombg);border-color:rgba(26,158,114,.2);}
.type-card.tc-tour{background:var(--tourbg);border-color:rgba(124,77,204,.2);}
.type-card-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.tc-vjbl .type-card-label{color:var(--vjbldk);}
.tc-dom .type-card-label{color:var(--domdk);}
.tc-tour .type-card-label{color:var(--tourdk);}
.type-card-rec{font-family:'Barlow Condensed';font-size:32px;font-weight:700;line-height:1;}
.tc-vjbl .type-card-rec{color:var(--vjbldk);}
.tc-dom .type-card-rec{color:var(--domdk);}
.tc-tour .type-card-rec{color:var(--tourdk);}
.type-card-pts{font-size:12px;color:var(--muted);margin-top:5px;}
.type-card-bar{height:3px;border-radius:2px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:10px;}
.type-card-bar-fill{height:100%;border-radius:2px;}
.tc-vjbl .type-card-bar-fill{background:var(--vjbl);}
.tc-dom .type-card-bar-fill{background:var(--dom);}
.tc-tour .type-card-bar-fill{background:var(--tour);}
.momentum-table{width:100%;border-collapse:collapse;}
.momentum-table th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 10px 10px;text-align:left;border-bottom:1px solid var(--line);}
.momentum-table td{padding:10px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;}
.momentum-table tr:last-child td{border-bottom:none;}
.momentum-table .gname{font-size:14px;font-weight:500;color:var(--ink);}
.momentum-table .gdate{font-size:12px;color:var(--muted);margin-top:1px;}
.qstrip{display:inline-flex;gap:4px;vertical-align:middle;}
.qcell{min-width:38px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-size:14px;font-weight:700;color:#fff;padding:0 6px;}
.qcell.w{background:var(--win);}
.qcell.l{background:var(--loss);}
.qcell.d{background:#9aa4b2;}
.qcell.na{background:#e8e6e1;color:#9aa4b2;}
.mom-legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;}
.mom-legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);}
.mom-dot{width:10px;height:10px;border-radius:3px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;}
th:first-child{text-align:left;}
td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
td:first-child{text-align:left;font-weight:500;}
tr:last-child td{border-bottom:none;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover td{background:var(--card2);}
tfoot td{background:var(--card2);font-weight:600;border-top:1px solid var(--line);border-bottom:none;}
.pos{color:var(--win);font-weight:600;}
.neg{color:var(--loss);font-weight:600;}
.badge{display:inline-flex;align-items:center;border-radius:5px;font-size:11px;font-weight:600;padding:3px 9px;white-space:nowrap;}
.badge.w{background:var(--winbg);color:var(--windk);}
.badge.l{background:var(--lossbg);color:var(--lossdk);}
.badge.d{background:#eef0f3;color:#5a6472;}
.tbl-wrap{overflow-x:auto;}
.gt-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;}
.gt-vjbl{background:var(--vjblbg);color:var(--vjbldk);}
.gt-dom{background:var(--dombg);color:var(--domdk);}
.gt-tour{background:var(--tourbg);color:var(--tourdk);}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.chart-card h4{margin:0 0 10px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.legend{font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
select{font-family:'Inter';font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;}
select:focus{outline:2px solid var(--vjbl);outline-offset:1px;}
label.flt{font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:5px;text-transform:uppercase;letter-spacing:.05em;}
.court-wrap{max-width:520px;}
.zone-bar{height:6px;border-radius:3px;background:#eee;overflow:hidden;width:70px;display:inline-block;vertical-align:middle;margin-right:6px;}
.zone-bar i{display:block;height:100%;}
/* ── PLAYER PANEL shared ── */
.pp-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
.pp-name{font-family:'Barlow Condensed';font-size:36px;font-weight:700;color:var(--ink);}
.pp-num{font-family:'Barlow Condensed';font-size:28px;font-weight:700;color:var(--maple);}
.pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:16px;}
.back-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--muted);margin-bottom:14px;font-family:'Inter';}
.back-btn:hover{color:var(--ink);border-color:var(--subtle);}
.gm-detail{background:var(--card2);}
.gm-detail>td{padding:16px 12px;}
/* ── PARENT PLAYER PANEL ── */
.p-player-card{background:var(--navy);border-radius:var(--radius);padding:24px 26px;margin-bottom:20px;}
.p-player-name{font-family:'Barlow Condensed';font-size:42px;font-weight:700;color:#fff;line-height:1;letter-spacing:.01em;}
.p-player-num{font-family:'Barlow Condensed';font-size:32px;font-weight:700;color:var(--maple);margin-right:10px;}
.p-player-team{font-size:12px;color:rgba(255,255,255,.45);margin-top:4px;}
.p-role-badge{display:inline-block;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:rgba(217,160,91,.18);color:var(--maple);margin-top:10px;letter-spacing:.03em;}
.p-summary{font-size:14px;color:rgba(255,255,255,.7);margin-top:12px;line-height:1.6;}
.p-summary strong{color:#fff;font-weight:500;}
.p-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:20px;}
.p-tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.p-tile .v{font-family:'Barlow Condensed';font-size:34px;font-weight:700;line-height:1;color:var(--ink);}
.p-tile .l{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:5px;}
.p-tile.hero{background:var(--winbg);border-color:rgba(26,158,114,.25);}
.p-tile.hero .v{color:var(--windk);}
.p-tile.t-amber .v{color:var(--amber);}
.trend-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;margin-left:8px;vertical-align:middle;}
.trend-up{background:#eaf7f1;color:var(--windk);}
.trend-down{background:#fdeeee;color:var(--lossdk);}
.trend-flat{background:#f0f0f0;color:#5a6472;}
.arc-read{margin-top:8px;padding-top:8px;border-top:1px solid var(--line2);line-height:1.4;}
.bench-note{font-size:11px;color:var(--muted);font-style:italic;}
/* ── advanced details accordion ── */
.adv-toggle{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer;color:var(--muted);font-family:'Inter';display:flex;align-items:center;gap:6px;margin-top:4px;}
.adv-toggle:hover{color:var(--ink);}
.adv-content{display:none;margin-top:12px;}
.adv-content.open{display:block;}
/* ── PARENT GAME EXPAND ── */
.pgm-expand{background:#f8f7f4;border-top:1px solid var(--line2);}
.pgm-expand>td{padding:18px 14px 20px;}
.pgm-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:16px;}
.pgm-stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px;}
.pgm-stat .sv{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--ink);line-height:1;}
.pgm-stat .sl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}
.pgm-stat.s-green .sv{color:var(--win);}
.pgm-stat.s-amber .sv{color:var(--amber);}
.pgm-stat.s-loss .sv{color:var(--loss);}
/* ── NOTICE ── */
.notice{padding:12px 16px;background:#fef9ec;border:1px solid #edd9a3;border-radius:8px;font-size:13px;color:#7a5500;margin-bottom:16px;line-height:1.5;}
/* ── ROTATION / BENCH DEPTH ── */
.bd-sub{font-size:12px;color:var(--muted);margin:-10px 0 16px;}
.bd-list{display:flex;flex-direction:column;gap:10px;}
.bd-row{display:grid;grid-template-columns:150px 1fr 96px;align-items:center;gap:14px;}
.bd-name{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bd-num{color:var(--maple);font-weight:700;margin-right:4px;}
.bd-track{height:22px;background:var(--line2);border-radius:5px;overflow:hidden;position:relative;}
.bd-fill{height:100%;border-radius:5px;transition:width .2s;}
.bd-fill.bd-high{background:var(--win);}
.bd-fill.bd-mid{background:var(--vjbl);}
.bd-fill.bd-low{background:#9aa4b2;}
.bd-val{font-size:12px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.bd-pct{color:var(--muted);font-size:11px;}
.bd-legend{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap;}
.rot-table{border-collapse:separate;border-spacing:3px;}
.rot-table th{font-size:10px;font-weight:600;color:var(--muted);padding:4px 8px;white-space:nowrap;text-align:center;text-transform:none;letter-spacing:0;border-bottom:none;}
.rot-table th:first-child{text-align:left;}
.rot-table td{padding:0;border-bottom:none;text-align:center;}
.rot-cell{min-width:56px;height:34px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;border-radius:5px;white-space:nowrap;}
.rot-legend{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);}
.rot-swatch{width:16px;height:12px;border-radius:3px;display:inline-block;}
.rot-swatch-lbl{margin-right:10px;}
footer{max-width:1140px;margin:0 auto;padding:0 24px 40px;font-size:12px;color:var(--subtle);}
@media(max-width:700px){
  main{padding:20px 16px 60px;}
  .card{padding:16px;}
  .card-dark{padding:20px 18px;}
  .hero-n{font-size:54px;}
  .tile .v{font-size:32px;}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
  .hd-tag{display:none;}
  .page-hd-team{font-size:26px;}
  .p-player-name{font-size:34px;}
}
@media(max-width:480px){
  .hero-meta{gap:18px;}
  .hero-meta-item .v{font-size:22px;}
}
</style>
</head>

<div id="coach-gate" style="position:fixed;inset:0;background:#101d31;display:flex;align-items:center;justify-content:center;padding:24px;z-index:9999;font-family:'Inter',-apple-system,sans-serif;">
  <div style="background:#fff;border-radius:14px;padding:36px 30px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);">
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase;color:#101d31;margin-bottom:4px;">Court<span style="color:#d9a05b;">Track</span></div>
    <div style="font-size:13px;color:#7c8698;margin-bottom:22px;">Darebin 12.1 Girls &middot; Coach access</div>
    <div style="font-size:13px;color:#344152;margin-bottom:14px;">Enter the coach passcode to view full team analytics.</div>

function getZone(x,y){
  if(y>155)return'other';

  if(!res.ok)throw new Error('Supabase '+res.status);
  const rows=await res.json();
  const games=rows.map(r=>{try{return typeof r.data==='string'?JSON.parse(r.data):r.data;}catch(e){return null;}})
    .filter(g=>g&&g.summary&&g.summary.stats)
    .sort((a,b)=>{const ra=a.round!=null?+a.round:9999,rb=b.round!=null?+b.round:9999;return ra!==rb?ra-rb:(a.id||0)-(b.id||0);});
  games.forEach(g=>{if(!g.gameType||g.gameType==='rep')g.gameType='vjbl';});
  const data={team:t,games,names:buildNames(t,games)};
  games.forEach(g=>{g._q=quarterScores(g);g._tot=teamTotals(g,data.names);});

  return data;

function buildNames(t,games){
  const m={};
  Object.keys(t.roster).forEach(id=>{m[id]={name:t.roster[id].name,num:t.roster[id].num};});
  games.forEach(g=>{
    (g.timeline||[]).forEach(ev=>{if(ev.data&&ev.data.pid!=null&&ev.data.player&&!m[ev.data.pid])m[ev.data.pid]={name:ev.data.player,num:''};});
    (g.shots||[]).forEach(s=>{if(s.player_id!=null&&s.player_name&&!m[s.player_id])m[s.player_id]={name:s.player_name,num:s.player_num||''};});
  });
  return m;
}
function pname(names,pid){return names[pid]?names[pid].name:'Player '+pid;}
function pnum(names,pid){return names[pid]?names[pid].num:'';}
function isTwoHalf(g){return g.gameType==='domestic'||g.gameType==='tournament';}
function quarterScores(g){
  if(!g.timeline||!g.timeline.length)return null;
  const per={};
  g.timeline.forEach(ev=>{if(ev.q!=null&&ev.scoreHome!=null)per[ev.q]={h:ev.scoreHome,a:ev.scoreAway};});
  const maxPeriods=isTwoHalf(g)?2:4;
  const qs=[],maxQ=Math.max(...Object.keys(per).map(Number),1);
  let ph=0,pa=0;
  for(let q=1;q<=Math.min(maxQ,maxPeriods);q++){
    if(!per[q]){qs.push(null);continue;}
    qs.push({h:per[q].h-ph,a:per[q].a-pa,label:isTwoHalf(g)?'H'+q:'Q'+q});
    ph=per[q].h;pa=per[q].a;
  }
  return qs;
}
const STAT_KEYS=['pts','fgm','fga','fgm3','fga3','ftm','fta','ast','oreb','dreb','stl','blk','tov','viol','foul'];
function teamTotals(g,names){

  Object.keys(g.summary.stats).forEach(pid=>{

/* ── parent player helpers ── */
function playerRole(a,allPlayers){
  // Rank by per-game rates to avoid bias from missed games
  const pgRate=(p,stat)=>p.gp>0?p[stat]/p.gp:0;
  const pgRateReb=(p)=>p.gp>0?(p.oreb+p.dreb)/p.gp:0;
  const rankBy=(fn)=>allPlayers.slice().sort((x,y)=>fn(y)-fn(x)).findIndex(p=>p.pid===a.pid)+1;
  const astRank=rankBy(p=>pgRate(p,'ast'));
  const rebRank=rankBy(pgRateReb);
  const ptsRank=rankBy(p=>pgRate(p,'pts'));
  const stlRank=rankBy(p=>pgRate(p,'stl'));
  const avgMinPG=allPlayers.filter(p=>p.gp>0).reduce((s,p)=>s+p.min/p.gp,0)/(allPlayers.filter(p=>p.gp>0).length||1);
  const minPG=a.gp>0?a.min/a.gp:0;
  if(astRank===1&&a.ast>0)return'Primary ball-handler';
  if(rebRank===1&&(a.oreb+a.dreb)>0)return'Team rebounder';
  if(ptsRank<=2&&a.pts>0)return'Primary scorer';
  if(stlRank===1&&a.stl>0)return'Defensive anchor';
  if(minPG>=(avgMinPG*0.55))return'Key rotation player';
  return'Developing rotation player';
}
function rollingAvg(vals,n){
  const out=[];
  for(let i=0;i<vals.length;i++){
    const start=Math.max(0,i-n+1);
    const slice=vals.slice(start,i+1);
    out.push(slice.reduce((s,v)=>s+v,0)/slice.length);
  }
  return out;
}
function trendBadge(vals){
  if(vals.length<4)return'';
  const ra=rollingAvg(vals,3);
  const early=ra[2];
  const late=ra[ra.length-1];
  if(early===0&&late===0)return'<span class="trend-badge trend-flat">— steady</span>';
  const base=Math.max(early,0.1); // avoid div/0; use tiny floor not 0.5
  const changePct=(late-early)/base;
  if(changePct>0.12)return'<span class="trend-badge trend-up">▲ trending up</span>';
  if(changePct<-0.12)return'<span class="trend-badge trend-down">▼ trending down</span>';
  return'<span class="trend-badge trend-flat">— steady</span>';
}
function playerSummary(a,allPlayers,data,pid){
  const n=allPlayers.length||1;
  const sorted=(stat)=>allPlayers.slice().sort((x,y)=>y[stat]-x[stat]);
  const ptsRank=sorted('pts').findIndex(p=>p.pid===a.pid)+1;
  const rebRank=sorted(p=>p.oreb+p.dreb).findIndex(p=>p.pid===a.pid)+1;
  const astRank=sorted('ast').findIndex(p=>p.pid===a.pid)+1;
  const stlRank=sorted('stl').findIndex(p=>p.pid===a.pid)+1;
  const ordinal=r=>r===1?'1st':r===2?'2nd':r===3?'3rd':r+'th';
  const minPG=a.gp>0?(a.min/a.gp).toFixed(1):'—';
  const ptsPG=a.gp>0?(a.pts/a.gp).toFixed(1):'—';
  // Find best two ranks among meaningful stats
  const ranks=[];
  if(a.pts>0)ranks.push({r:ptsRank,label:'scoring'});
  if(a.oreb+a.dreb>0)ranks.push({r:rebRank,label:'rebounds'});
  if(a.ast>0)ranks.push({r:astRank,label:'assists'});
  if(a.stl>0)ranks.push({r:stlRank,label:'steals'});
  ranks.sort((a,b)=>a.r-b.r);
  const top2=ranks.slice(0,2);
  // Trend
  const ptsVals=data.games.map(g=>(g.summary.stats[pid]||{}).pts||0);
  const minVals=data.games.map(g=>g.summary.minutes[pid]||0);
  const ptsTrend=trendBadge(ptsVals);
  const minTrend=trendBadge(minVals);
  let s='<strong>'+pname(data.names,pid)+'</strong> averages <strong>'+minPG+' min/game</strong> and <strong>'+ptsPG+' points/game</strong> across '+a.gp+' game'+(a.gp===1?'':'s')+'. ';
  if(top2.length>=2)s+='She ranks <strong>'+ordinal(top2[0].r)+'</strong> on the team in '+top2[0].label+' and <strong>'+ordinal(top2[1].r)+'</strong> in '+top2[1].label+'.';
  else if(top2.length===1)s+='She ranks <strong>'+ordinal(top2[0].r)+'</strong> on the team in '+top2[0].label+'.';
  if(ptsTrend||minTrend){
    const ptsTrendTxt=ptsTrend.replace(/<[^>]+>/g,'').replace(/[▲▼—]\s*/,'').trim();
    const minTrendTxt=minTrend.replace(/<[^>]+>/g,'').replace(/[▲▼—]\s*/,'').trim();
    const pts5=metricArc(ptsVals,5),min5=metricArc(minVals,5);
    const ptsConf=pts5&&metricArc(ptsVals,3)&&metricArc(ptsVals,3).dir===pts5.dir&&metricArc(ptsVals,3).dir!=='flat'?' (confirmed 5g)':'';
    const minConf=min5&&metricArc(minVals,3)&&metricArc(minVals,3).dir===min5.dir&&metricArc(minVals,3).dir!=='flat'?' (confirmed 5g)':'';
    s+=' 3-game trend: scoring <strong>'+ptsTrendTxt+ptsConf+'</strong>, minutes <strong>'+minTrendTxt+minConf+'</strong>.';
  }
  return s;
}

/* ── momentum strip ── */
function qstrip(g){
  const qs=g._q;
  if(!qs)return'<span class="qstrip"><span class="qcell na">?</span></span>';
  return'<span class="qstrip">'+qs.map((q,i)=>{
    if(!q)return'<span class="qcell na">'+(isTwoHalf(g)?'H':'Q')+(i+1)+'</span>';
    const d=q.h-q.a,cls=d>0?'w':d<0?'l':'d',lbl=q.label||(isTwoHalf(g)?'H':'Q')+(i+1);
    return'<span class="qcell '+cls+'" title="'+lbl+': '+q.h+'–'+q.a+'">'+(d>0?'+':'')+d+'</span>';
  }).join('')+'</span>';
}

/* ── bar charts ── */
function barChart(games,fn,fn2,c1,c2,fmt){
  const W=280,H=140,P=8,n=games.length;
  if(!n)return'<div style="color:var(--muted);font-size:12px;padding:8px 0;">No data yet</div>';
  const vals=games.map(fn),vals2=fn2?games.map(fn2):[];
  const max=Math.max(...vals,...(vals2.length?vals2:[0]),1);
  const bw=Math.min(24,(W-2*P)/n/(fn2?2.4:1.4));
  let s='<svg viewBox="0 0 '+W+' '+(H+28)+'" style="width:100%;">';
  s+='<line x1="'+P+'" y1="'+(H/2)+'" x2="'+(W-P)+'" y2="'+(H/2)+'" stroke="#e8e6e1" stroke-width="1"/>';
  games.forEach((g,i)=>{
    const gx=P+(W-2*P)*(i+0.5)/n;
    const h1=Math.max(2,vals[i]/max*(H-18));
    const x1=fn2?gx-bw-1:gx-bw/2;
    s+='<rect x="'+x1+'" y="'+(H-h1)+'" width="'+bw+'" height="'+h1+'" rx="3" fill="'+c1+'"><title>'+gLabel(g)+': '+(fmt?fmt(vals[i]):vals[i])+'</title></rect>';
    if(fn2){
      const h2=Math.max(2,vals2[i]/max*(H-18));
      s+='<rect x="'+(gx+1)+'" y="'+(H-h2)+'" width="'+bw+'" height="'+h2+'" rx="3" fill="'+c2+'"><title>'+gLabel(g)+': '+(fmt?fmt(vals2[i]):vals2[i])+'</title></rect>';
    }
    const lbl=g.round?('R'+g.round):(g.opponent||'?').substring(0,4);
    s+='<text x="'+gx+'" y="'+(H+16)+'" text-anchor="middle" font-size="8" fill="#9aa4b2">'+lbl+'</text>';
    s+='<text x="'+(fn2?gx-bw/2-1:gx)+'" y="'+(H-h1-4)+'" text-anchor="middle" font-size="10" font-weight="600" fill="#5a6472">'+(fmt?fmt(vals[i]):vals[i])+'</text>';
  });
  return s+'</svg>';
}

/* ── PROGRESSION: line chart (smoothed arc over raw scatter) ── */
function lineChart(games,fn,color,fmt){
  const W=280,H=140,P=12,n=games.length;
  if(!n)return'<div style="color:var(--muted);font-size:12px;padding:8px 0;">No data yet</div>';
  const vals=games.map(fn);
  const ra=rollingAvg(vals,3);
  const max=Math.max(...vals,1),min=Math.min(...vals,0),range=(max-min)||1;
  const yOf=v=>H-14-((v-min)/range)*(H-30);
  const xOf=i=>P+(W-2*P)*(n===1?0.5:i/(n-1));
  let s='<svg viewBox="0 0 '+W+' '+(H+22)+'" style="width:100%;">';
  s+='<line x1="'+P+'" y1="'+yOf(min)+'" x2="'+(W-P)+'" y2="'+yOf(min)+'" stroke="#f0eeea" stroke-width="1"/>';
  games.forEach((g,i)=>{s+='<circle cx="'+xOf(i)+'" cy="'+yOf(vals[i])+'" r="2.5" fill="'+color+'" fill-opacity="0.25"><title>'+gLabel(g)+': '+(fmt?fmt(vals[i]):vals[i])+'</title></circle>';});
  let path='';ra.forEach((v,i)=>{path+=(i?'L':'M')+xOf(i).toFixed(1)+' '+yOf(v).toFixed(1)+' ';});
  s+='<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  s+='<circle cx="'+xOf(n-1)+'" cy="'+yOf(ra[n-1])+'" r="3.6" fill="'+color+'"><title>3-game rolling avg: '+(fmt?fmt(Math.round(ra[n-1]*10)/10):Math.round(ra[n-1]*10)/10)+'</title></circle>';
  s+='<text x="'+xOf(n-1)+'" y="'+(yOf(ra[n-1])-7)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+color+'">'+(fmt?fmt(Math.round(ra[n-1]*10)/10):Math.round(ra[n-1]*10)/10)+'</text>';
  s+='<text x="'+xOf(n-1)+'" y="'+(yOf(ra[n-1])-17)+'" text-anchor="middle" font-size="8" fill="'+color+'" opacity="0.6">3g avg</text>';
  games.forEach((g,i)=>{if(n>8&&i%2!==0&&i!==n-1)return;s+='<text x="'+xOf(i)+'" y="'+(H+12)+'" text-anchor="middle" font-size="8" fill="#9aa4b2">'+(g.round?'R'+g.round:(g.opponent||'?').substring(0,3))+'</text>';});
  return s+'</svg>';
}
/* metric arc: early vs late n-game rolling avg */
function metricArc(vals,n){
  n=n||3;
  if(vals.length<n+1)return null;
  const ra=rollingAvg(vals,n);
  const early=ra[n-1],late=ra[ra.length-1];
  const dir=late>early+0.3?'up':late<early-0.3?'down':'flat';
  return{early:Math.round(early*10)/10,late:Math.round(late*10)/10,dir,delta:Math.round((late-early)*10)/10,n};
}
/* coach read — dual-window: 3-game short signal + 5-game confirmed trend */
function coachRead(vals,label,goodDir,unit){
  const a3=metricArc(vals,3);
  const a5=metricArc(vals,5);
  if(!a3)return'<div class="arc-read"><span style="color:var(--muted);font-size:11.5px;">Need 4+ games for a trend read.</span></div>';
  const u=unit||'';
  const renderArc=(a,window)=>{
    if(!a)return'';
    const good=goodDir>0?a.dir==='up':a.dir==='down';
    const bad=goodDir>0?a.dir==='down':a.dir==='up';
    const arrow=a.dir==='up'?'▲':a.dir==='down'?'▼':'—';
    const cls=good?'trend-up':bad?'trend-down':'trend-flat';
    const word=good?'improving':bad?'watch':'steady';
    const body=a.dir==='flat'?('~'+a.late+u):(a.early+u+' → '+a.late+u);
    return'<span style="margin-right:10px;"><span class="trend-badge '+cls+'">'+arrow+' '+window+': '+word+'</span> <span style="color:var(--ink2);font-size:11px;">'+body+'</span></span>';
  };
  // Agreement / disagreement signals
  let confirm='';
  if(a5&&a3.dir===a5.dir&&a3.dir!=='flat'){
    const good=goodDir>0?a3.dir==='up':a3.dir==='down';
    confirm='<span style="font-size:11px;color:'+(good?'var(--windk)':'var(--lossdk)')+'">'+(good?'✓ confirmed across both windows':'⚠ sustained across both windows')+'</span>';
  }else if(a5&&a3.dir!==a5.dir&&a3.dir!=='flat'){
    confirm='<span style="font-size:11px;color:var(--muted);">Recent shift — not yet confirmed over 5 games</span>';
  }else if(a5&&a3.dir==='flat'&&a5.dir!=='flat'){
    const good=goodDir>0?a5.dir==='up':a5.dir==='down';
    confirm='<span style="font-size:11px;color:'+(good?'var(--windk)':'var(--lossdk)')+'">'+(good?'↗ 5g shows recovering trend':'↘ 5g shows fading trend')+' (3g stabilising)</span>';
  }
  return'<div class="arc-read" style="flex-direction:column;align-items:flex-start;gap:3px;">'+renderArc(a3,'3g')+renderArc(a5,'5g')+(confirm?'<div>'+confirm+'</div>':'')+'</div>';
}

function zoneTable(shots){
  const zd={};SC_ZONES.forEach(z=>zd[z.id]={made:0,total:0,label:z.label});
  shots.forEach(s=>{const z=getZone(parseFloat(s.x),parseFloat(s.y));if(!zd[z])return;zd[z].total++;if(s.made)zd[z].made++;});
  const rows=SC_ZONES.map(z=>{

function seasonPlayersFiltered(data,games){
  const agg={};
  games.forEach(g=>{
    Object.keys(g.summary.stats).forEach(pid=>{
      const min=g.summary.minutes[pid]||0;
      if(!agg[pid])agg[pid]={pid:+pid,gp:0,min:0,pts:0,fgm:0,fga:0,fgm3:0,fga3:0,ftm:0,fta:0,ast:0,oreb:0,dreb:0,stl:0,blk:0,tov:0,viol:0,foul:0,pm:0};
      const a=agg[pid],s=g.summary.stats[pid]||{};
      if(min>0.5)a.gp++;
      a.min+=min;
      STAT_KEYS.forEach(k=>a[k]+=s[k]||0);
      a.pm+=(g.summary.plusMinus&&g.summary.plusMinus[pid])||0;
    });
  });
  return Object.values(agg).filter(a=>a.gp>0||a.min>0.5).sort((a,b)=>b.pts-a.pts);
}

function buildOnCourtSecsMap(g){
  const{segs}=buildOnCourtStints(g);
  const out={};
  Object.keys(segs).forEach(pid=>{out[pid]=segs[pid].reduce((s,seg)=>s+(seg.end-seg.start),0);});

}
function rotationPlayerAgg(gs){
  const agg={},secsCache={};
  gs.forEach(g=>{
    const secsMap=buildOnCourtSecsMap(g);
    secsCache[g.id]=secsMap;
    Object.keys(secsMap).forEach(pidStr=>{
      const pid=Number(pidStr),mins=secsMap[pidStr]/60;
      if(!agg[pid])agg[pid]={pid,gp:0,min:0};
      if(mins>0.5)agg[pid].gp++;
      agg[pid].min+=mins;
    });
  });
  return{rows:Object.values(agg),secsCache};
}

function rotCellColor(pct,played){

/* ── ON-COURT TIMELINE — reconstructed from sub_on/sub_off/start events ── */
function parseElapsedSecs(ts){
  if(!ts)return 0;
  const parts=ts.split(' ');
  if(parts.length<2)return 0;
  const mmss=parts[1].split(':');
  if(mmss.length<2)return 0;
  return(parseInt(mmss[0])||0)*60+(parseInt(mmss[1])||0);
}
function buildOnCourtStints(g){
  const periodSecs=g.periodSecs||(isTwoHalf(g)?1200:420);
  const tl=(g.timeline||[]).slice().sort((a,b)=>(a.id||0)-(b.id||0));
  const open={},segs={};
  const addSeg=(pid,q,start,end)=>{if(end<=start)return;if(!segs[pid])segs[pid]=[];segs[pid].push({q,start,end});};
  const closeStint=(pid,endQ,endElapsed)=>{
    const o=open[pid];if(!o)return;
    if(endQ===o.q){addSeg(pid,o.q,o.elapsed,endElapsed);}
    else{
      addSeg(pid,o.q,o.elapsed,periodSecs);
      for(let q=o.q+1;q<endQ;q++)addSeg(pid,q,0,periodSecs);
      addSeg(pid,endQ,0,endElapsed);
    }
    delete open[pid];
  };
  let maxQ=1;
  tl.forEach(ev=>{
    maxQ=Math.max(maxQ,ev.q||1);
    if(ev.type==='start'){
      ((ev.data&&ev.data.pids)||[]).forEach(pid=>{open[pid]={q:1,elapsed:0};});
    }else if(ev.type==='sub_on'){
      const pid=ev.data&&ev.data.pid;if(pid==null)return;
      open[pid]={q:ev.q||1,elapsed:parseElapsedSecs(ev.ts)};
    }else if(ev.type==='sub_off'){
      const pid=ev.data&&ev.data.pid;if(pid==null)return;
      closeStint(pid,ev.q||1,parseElapsedSecs(ev.ts));
    }
  });
  const finalQ=Math.max(maxQ,g.quarter||1);
  Object.keys(open).forEach(pid=>{closeStint(Number(pid),finalQ,periodSecs);});
  const periods=isTwoHalf(g)?2:Math.min(4,Math.max(finalQ,1));
  return{segs,periods,periodSecs};
}
function renderOnCourtTimeline(d,g){
  const{segs,periods,periodSecs}=buildOnCourtStints(g);
  const pids=Object.keys(segs).map(Number);
  if(!pids.length)return'<div style="color:var(--muted);font-size:12px;padding:8px 0;">No on-court tracking logged for this game.</div>';
  const totalSecs={};
  pids.forEach(pid=>{totalSecs[pid]=(segs[pid]||[]).reduce((s,seg)=>s+(seg.end-seg.start),0);});
  const order=pids.slice().sort((a,b)=>totalSecs[b]-totalSecs[a]);
  const totalWidth=periods*periodSecs;
  const rowH=28,gap=6,labelW=150,chartW=560,rightW=64;
  const svgW=labelW+chartW+rightW;
  const svgH=order.length*(rowH+gap)+30;
  const xOf=sec=>labelW+(sec/totalWidth)*chartW;
  let s='<div style="overflow-x:auto;"><svg viewBox="0 0 '+svgW+' '+svgH+'" style="width:100%;min-width:560px;display:block;">';
  for(let p=1;p<=periods;p++){
    const x0=xOf((p-1)*periodSecs),x1=xOf(p*periodSecs);
    s+='<line x1="'+x1+'" y1="16" x2="'+x1+'" y2="'+(svgH-6)+'" stroke="#e8e6e1" stroke-width="1"/>';
    s+='<text x="'+((x0+x1)/2)+'" y="12" text-anchor="middle" font-size="10" font-weight="600" fill="#9aa4b2">'+(periods===2?'H':'Q')+p+'</text>';
  }
  order.forEach((pid,i)=>{
    const y=22+i*(rowH+gap);
    s+='<text x="0" y="'+(y+rowH/2+4)+'" font-size="12" font-weight="500" fill="#17202b">'+pnum(d.names,pid)+' '+pname(d.names,pid)+'</text>';
    (segs[pid]||[]).forEach(seg=>{
      const gx=xOf((seg.q-1)*periodSecs+seg.start),gx2=xOf((seg.q-1)*periodSecs+seg.end);
      s+='<rect x="'+gx+'" y="'+y+'" width="'+Math.max(1,gx2-gx)+'" height="'+rowH+'" rx="4" fill="var(--vjbl)"><title>'+pname(d.names,pid)+' '+(periods===2?'H':'Q')+seg.q+': '+Math.round((seg.end-seg.start)/6)/10+' min</title></rect>';
    });
    const mins=(totalSecs[pid]/60).toFixed(1);
    s+='<text x="'+(svgW-rightW+8)+'" y="'+(y+rowH/2+4)+'" font-size="12" font-weight="600" fill="#344152">'+mins+'m</text>';
  });
  return s+'</svg></div>';
}

  }

  gs.forEach(g=>{
    const gid=String(g.id),open=expandedOppGame===gid,tracked=isFilmed(g),ot=oppTeamTotals(g);
    h+='<tr class="clickable" onclick="toggleOppGame(\''+gid+'\')"><td>'+(g.opponent||'Unknown')+'<span style="color:var(--muted);font-weight:400;"> · '+gLabel(g)+'</span></td><td style="color:var(--muted);">'+(g.date||'')+'</td><td>'+resBadge(g)+'</td><td>'+(tracked?'<span class="badge w">Player-tracked</span>':'<span class="badge d">Team totals only</span>')+'</td><td>'+ot.pts+'</td><td>'+ot.tov+'</td><td>'+(ot.reb||'—')+'</td></tr>';
    if(open)h+='<tr class="gm-detail"><td colspan="7">'+(tracked?oppBoxScore(d,g):oppTeamOnlyCard(g))+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  const f=oppShootFilters;
  const filmedGs=gs.filter(isFilmed);
  let shots=filmedGs.flatMap(g=>oppShots(g).map(s=>({...s,_gid:String(g.id)})));
  if(f.game!=='all')shots=shots.filter(s=>s._gid===f.game);
  if(f.q!=='all')shots=shots.filter(s=>String(s.period)===f.q);
  if(f.result!=='all')shots=shots.filter(s=>f.result==='made'?s.made:!s.made);
  h+='<div class="card"><div class="sec-h">Opponent shot chart — player-tracked games only ('+filmedGs.length+' of '+gs.length+')</div>';
  if(!filmedGs.length){
    h+='<div style="color:var(--muted);font-size:13px;">Opponent shooting data isn\'t available yet — this section fills in as more games are recorded with full tracking.</div></div>';
  }else{
    h+='<div class="filters">';
    h+='<label class="flt">Game<select onchange="oppShootFilters.game=this.value;render();"><option value="all"'+(f.game==='all'?' selected':'')+'>All tracked games</option>'+filmedGs.map(g=>'<option value="'+g.id+'"'+(f.game===String(g.id)?' selected':'')+'>'+gLabel(g)+' vs '+(g.opponent||'?')+'</option>').join('')+'</select></label>';
    h+='<label class="flt">Quarter<select onchange="oppShootFilters.q=this.value;render();"><option value="all"'+(f.q==='all'?' selected':'')+'>All</option>'+[1,2,3,4].map(q=>'<option value="'+q+'"'+(f.q===String(q)?' selected':'')+'>Q'+q+'</option>').join('')+'</select></label>';
    h+='<label class="flt">Result<select onchange="oppShootFilters.result=this.value;render();"><option value="all">All shots</option><option value="made"'+(f.result==='made'?' selected':'')+'>Made</option><option value="missed"'+(f.result==='missed'?' selected':'')+'>Missed</option></select></label>';
    h+='</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;"><div class="court-wrap">'+courtSVG(shots)+'<div class="legend" style="margin-top:10px;"><span><i style="background:#1a9e72;border-radius:50%;"></i>Made</span><span><i style="background:#d9413f;"></i>Missed</span><span style="margin-left:auto;color:var(--muted);">'+shots.length+' attempts shown</span></div></div><div>'+zoneTable(shots)+'</div></div></div>';
  }
  return h;
}
function scoutByOpponent(d){
  const byOpp={};
  d.games.forEach(g=>{const key=(g.opponent||'Unknown').trim();if(!byOpp[key])byOpp[key]={name:key,games:[]};byOpp[key].games.push(g);});
  return Object.values(byOpp).filter(o=>o.games.length>1);
}
function oppBoxScore(d,g){
  const pids=Object.keys(g.oppSummary.stats).map(Number).filter(pid=>(g.oppSummary.minutes[pid]||0)>0.5||((g.oppSummary.stats[pid]||{}).pts||0)>0)
    .sort((a,b)=>((g.oppSummary.stats[b]||{}).pts||0)-((g.oppSummary.stats[a]||{}).pts||0));
  const to=timeoutCounts(g),ot=oppTeamTotals(g);
  let h='<div class="sec-h" style="margin-bottom:10px;">'+(g.opponent||'Opponent')+' box score — '+gLabel(g)+' <span style="text-transform:none;font-weight:400;color:var(--muted);">&middot; Timeouts: them '+to.a+', us '+to.h+'</span></div><div class="tbl-wrap"><table><thead><tr><th>Player</th><th>Min</th><th>PTS</th><th>FG</th><th>FG%</th><th>3P</th><th>FT</th><th>OREB</th><th>DREB</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TOV</th><th>VIOL</th><th>F</th></tr></thead><tbody>';
  pids.forEach(pid=>{
    const s=g.oppSummary.stats[pid]||{},m=g.oppSummary.minutes[pid]||0;
    h+='<tr><td>'+(oppPnum(g,pid)?oppPnum(g,pid)+' ':'')+oppPname(g,pid)+'</td><td>'+fmtMin(m)+'</td><td><strong>'+(s.pts||0)+'</strong></td><td>'+(s.fgm||0)+'/'+(s.fga||0)+'</td><td>'+pct(s.fgm||0,s.fga||0)+'</td><td>'+((s.fga3||0)?(s.fgm3||0)+'/'+(s.fga3||0):'—')+'</td><td>'+((s.fta||0)?(s.ftm||0)+'/'+(s.fta||0):'—')+'</td><td>'+(s.oreb||0)+'</td><td>'+(s.dreb||0)+'</td><td>'+((s.oreb||0)+(s.dreb||0))+'</td><td>'+(s.ast||0)+'</td><td>'+(s.stl||0)+'</td><td>'+(s.blk||0)+'</td><td>'+(s.tov||0)+'</td><td>'+(s.viol||0)+'</td><td>'+(s.foul||0)+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><td>TEAM'+(g.oppTeamTov?' (incl '+g.oppTeamTov+' team TOV)':'')+'</td><td>—</td><td>'+ot.pts+'</td><td>'+ot.fgm+'/'+ot.fga+'</td><td>'+pct(ot.fgm,ot.fga)+'</td><td>'+(ot.fga3?ot.fgm3+'/'+ot.fga3:'—')+'</td><td>'+(ot.fta?ot.ftm+'/'+ot.fta:'—')+'</td><td>'+ot.oreb+'</td><td>'+ot.dreb+'</td><td>'+ot.reb+'</td><td>'+ot.ast+'</td><td>'+ot.stl+'</td><td>'+ot.blk+'</td><td>'+ot.tov+'</td><td>'+ot.viol+'</td><td>'+ot.foul+'</td></tr></tfoot></table></div>';
  const os=oppShots(g);
  if(os.length)h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:14px;"><div class="court-wrap">'+courtSVG(os)+'</div><div>'+zoneTable(os)+'</div></div>';
  return h;
}
function oppTeamOnlyCard(g){
  const ot=oppTeamTotals(g),to=timeoutCounts(g);
  const reason=g.filmed===false?'Game not filmed — individual tracking unavailable.':'Individual opponent tracking not logged for this game.';
  return'<div style="font-size:13px;color:var(--ink2);line-height:2;"><strong>'+ot.pts+'</strong> points scored against us'+(ot.reb?' &middot; <strong>'+ot.reb+'</strong> rebounds against ('+ot.oreb+' off / '+ot.dreb+' def)':' &middot; rebounds not logged')+' &middot; <strong>'+ot.tov+'</strong> turnovers forced &middot; timeouts: them '+to.a+', us '+to.h+'<br><span style="color:var(--muted);font-size:12px;">'+reason+'</span></div>';
}
function toggleOppGame(gid){expandedOppGame=expandedOppGame===gid?null:gid;render();}

/* ── game type filter bar for tabs that need it ── */
function gameTypeFilterBar(allGs){
  const types=['all','vjbl','domestic','tournament'];
  const labels={all:'All games',vjbl:'VJBL',domestic:'Domestic',tournament:'Tournament'};
  const activeCls={all:'active-all',vjbl:'active-vjbl',domestic:'active-dom',tournament:'active-tour'};
  const counts={all:allGs.length};
  ['vjbl','domestic','tournament'].forEach(t=>{counts[t]=allGs.filter(g=>(g.gameType||'vjbl')===t).length;});
  let h='<div class="type-pills">';
  types.forEach(t=>{
    if(t!=='all'&&counts[t]===0)return;
    const active=activeGameType===t;
    const cls='type-pill'+(active?' '+(activeCls[t]||'active-all'):'');
    h+='<button class="'+cls+'" onclick="activeGameType=\''+t+'\';render();">'+labels[t]+' <span class="pill-rec">'+counts[t]+'</span></button>';
  });
  return h+'</div>';
}

function vAnalytics(d){

  h+='<div class="chart-card"><h4>Field goal % by game</h4>'+barChart(gs,g=>g._tot.fga?Math.round(g._tot.fgm/g._tot.fga*100):0,null,'#2d6fb5',null,v=>v+'%')+'</div>';

function parentGameExpand(d,pid,g){
  const s=g.summary.stats[pid]||{};
  const m=g.summary.minutes[pid]||0;
  const reb=(s.oreb||0)+(s.dreb||0);
  const fg=(s.fga||0)?(s.fgm||0)+'/'+(s.fga||0)+' ('+pct(s.fgm||0,s.fga||0)+')':'—';
  const tp=(s.fga3||0)?(s.fgm3||0)+'/'+(s.fga3||0):'—';
  const ft=(s.fta||0)?(s.ftm||0)+'/'+(s.fta||0):'—';
  let h='<div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;">'+gLabel(g)+' — '+pname(d.names,pid)+'\'s game</div>';
  h+='<div class="pgm-stat-grid">';
  h+='<div class="pgm-stat"><div class="sv">'+(s.pts||0)+'</div><div class="sl">Points</div></div>';
  h+='<div class="pgm-stat"><div class="sv">'+fmtMin(m)+'</div><div class="sl">Minutes</div></div>';
  h+='<div class="pgm-stat"><div class="sv">'+reb+'</div><div class="sl">Rebounds</div></div>';
  h+='<div class="pgm-stat s-green"><div class="sv">'+(s.ast||0)+'</div><div class="sl">Assists</div></div>';
  h+='<div class="pgm-stat s-green"><div class="sv">'+(s.stl||0)+'</div><div class="sl">Steals</div></div>';
  h+='<div class="pgm-stat s-amber"><div class="sv">'+(s.tov||0)+'</div><div class="sl">Turnovers</div></div>';
  h+='<div class="pgm-stat s-amber"><div class="sv">'+(s.foul||0)+'</div><div class="sl">Fouls</div></div>';
  h+='<div class="pgm-stat"><div class="sv" style="font-size:18px;padding-top:4px;">'+fg+'</div><div class="sl">Field goals</div></div>';

/* ═══ COACH: SEASON PROGRESSION ═══ */
function vProgressionCoach(d){
  const allGsV=d.games;
  const gs=filteredGames(allGsV);
  const flabel=activeGameType==='all'?'all games':{vjbl:'VJBL',domestic:'Domestic',tournament:'Tournament'}[activeGameType]+' games';
  let h=gameTypeFilterBar(allGsV);
  if(gs.length<2)return h+'<div class="card"><div class="sec-h">Season progression</div><div style="color:var(--muted);font-size:13px;padding:6px 0;">Need at least 2 '+flabel+' synced'+(gs.length===1?' — only 1 logged so far':'')+'. Trend reads unlock at 4 games.</div></div>';
  // cumulative record arc
  let w=0,l=0,dr=0;gs.forEach(g=>{const diff=(g.scoreHome||0)-(g.scoreAway||0);if(diff>0)w++;else if(diff<0)l++;else dr++;});
  const has5=(gs.length>=6);
  const trendNote=has5?'3-game (short signal) + 5-game (confirmed trend)':'3-game trend line · 5-game confirmation window unlocks at 6 games';
  let h2='<div class="card"><div class="sec-h">Season arc — '+flabel+' &nbsp;·&nbsp; <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;color:var(--muted);">'+gs.length+' games · '+trendNote+'</span></div>';
  h2+='<div style="font-size:12.5px;color:var(--ink2);margin-bottom:14px;">Record: <strong>'+w+'–'+l+(dr?'–'+dr:'')+'</strong>. Dots = individual games, line = rolling average. Where both 3g and 5g windows agree, the trend is real — treat single-window signals with caution.</div>';
  h2+='<div class="charts">';
  const metrics=[
    ['Points for',g=>g._tot.pts,'#1a9e72',1,''],
    ['Points against',g=>g._tot?(oppTeamTotals(g).pts||g.scoreAway||0):(g.scoreAway||0),'#d9413f',-1,''],
    ['Field goal %',g=>g._tot.fga?Math.round(g._tot.fgm/g._tot.fga*100):0,'#2d6fb5',1,'%'],
    ['Turnovers',g=>g._tot.tov,'#c87d1a',-1,''],
    ['Assists',g=>g._tot.ast,'#7c4dcc',1,''],
    ['Rebounds',g=>g._tot.reb,'#5a6472',1,'']
  ];
  metrics.forEach(m=>{
    const vals=gs.map(m[1]);
    h2+='<div class="chart-card"><h4>'+m[0]+'</h4>'+lineChart(gs,m[1],m[2],m[4]==='%'?(v=>v+'%'):null)+coachRead(vals,m[0],m[3],m[4])+'</div>';
  });
  h2+='</div></div>';
  h+=h2;
  // player movement — dual window (3g + 5g)
  const sp=seasonPlayers(d).filter(a=>{
    // count games played within the filtered set
    const pgInFilter=gs.filter(g=>g.summary&&g.summary.minutes&&(g.summary.minutes[a.pid]||0)>0).length;
    return pgInFilter>=4;
  });
  if(sp.length){
    // Build per-player signal using filtered games
    const entries=[];
    sp.forEach(a=>{
      const pid=a.pid;
      const ptsVals=gs.map(g=>(g.summary.stats[pid]||{}).pts||0);
      const minVals=gs.map(g=>+(g.summary.minutes[pid]||0).toFixed(1));
      const tovVals=gs.map(g=>(g.summary.stats[pid]||{}).tov||0);
      const rebVals=gs.map(g=>{const s=g.summary.stats[pid]||{};return(s.oreb||0)+(s.dreb||0);});
      const astVals=gs.map(g=>(g.summary.stats[pid]||{}).ast||0);
      const signals=[];
      // pts
      const pts3=metricArc(ptsVals,3),pts5=metricArc(ptsVals,5);
      if(pts3&&pts3.dir!=='flat'){const conf=pts5&&pts5.dir===pts3.dir;signals.push({cat:pts3.dir==='up'?'up':'down',text:'scoring '+(pts3.dir==='up'?'up':'down')+' '+pts3.early+'→'+pts3.late+(conf?' ✓':''),conf});}
      // minutes
      const min3=metricArc(minVals,3),min5=metricArc(minVals,5);
      if(min3&&min3.dir!=='flat'){const conf=min5&&min5.dir===min3.dir;signals.push({cat:min3.dir==='up'?'up':'down',text:'minutes '+(min3.dir==='up'?'climbing':'dipping')+(conf?' ✓':''),conf});}
      // turnovers (down = good)
      const tov3=metricArc(tovVals,3),tov5=metricArc(tovVals,5);
      if(tov3&&tov3.dir!=='flat'){const good=tov3.dir==='down';const conf=tov5&&tov5.dir===tov3.dir;signals.push({cat:good?'up':'down',text:good?'turnovers down '+tov3.early+'→'+tov3.late+(conf?' ✓':''):'turnover rate up '+tov3.early+'→'+tov3.late+(conf?' ✓':''),conf});}
      // assists
      const ast3=metricArc(astVals,3),ast5=metricArc(astVals,5);
      if(ast3&&ast3.dir!=='flat'){const conf=ast5&&ast5.dir===ast3.dir;signals.push({cat:ast3.dir==='up'?'up':'down',text:'assists '+(ast3.dir==='up'?'up '+ast3.early+'→'+ast3.late:'down '+ast3.early+'→'+ast3.late)+(conf?' ✓':''),conf});}
      entries.push({name:pnum(d.names,pid)+' '+pname(d.names,pid),signals,pid});
    });
    const rising=entries.filter(e=>e.signals.some(s=>s.cat==='up'));
    const monitor=entries.filter(e=>e.signals.some(s=>s.cat==='down'));
    h+='<div class="card"><div class="sec-h">Player movement &nbsp;·&nbsp; <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;color:var(--muted);">3g + 5g rolling windows · ✓ = confirmed across both · players with 4+ games in this filter</span></div>';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">';
    h+='<div><div style="font-size:12px;font-weight:700;color:var(--windk);margin-bottom:8px;">▲ Moving forward</div>';
    if(rising.length){
      rising.forEach(r=>{
        const ups=r.signals.filter(s=>s.cat==='up');
        h+='<div style="font-size:12.5px;color:var(--ink2);margin-bottom:8px;"><strong>'+r.name+'</strong><br><span style="font-size:11.5px;">'+ups.map(s=>'<span style="color:'+(s.conf?'var(--windk)':'var(--ink2)')+';">'+s.text+'</span>').join(' · ')+'</span></div>';
      });
    }else h+='<div style="color:var(--muted);font-size:12px;">No clear upward movers in this window.</div>';
    h+='</div>';
    h+='<div><div style="font-size:12px;font-weight:700;color:var(--lossdk);margin-bottom:8px;">▼ Monitor closely</div>';
    if(monitor.length){
      monitor.forEach(r=>{
        const downs=r.signals.filter(s=>s.cat==='down');
        h+='<div style="font-size:12.5px;color:var(--ink2);margin-bottom:8px;"><strong>'+r.name+'</strong><br><span style="font-size:11.5px;">'+downs.map(s=>'<span style="color:'+(s.conf?'var(--lossdk)':'var(--ink2)')+';">'+s.text+'</span>').join(' · ')+'</span></div>';
      });
    }else h+='<div style="color:var(--muted);font-size:12px;">Nothing flagged — group holding steady.</div>';
    h+='</div></div>';
    h+='<div style="font-size:11px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--line2);">Signal, not verdict. Small samples move fast. Cross-check minutes played and matchup strength before acting on single-window flags.</div>';
    h+='</div>';
  }
  return h;
}

/* ═══ FAMILY: MY PLAYER'S PROGRESSION ═══ */
function vProgressionParent(d){
  if(selPlayer==null)return progressionPickerParent(d);
  const pid=selPlayer;
  const allPlayers=seasonPlayers(d);
  const a=allPlayers.find(x=>x.pid===pid);
  if(!a)return progressionPickerParent(d);
  const name=pname(d.names,pid),num=pnum(d.names,pid);
  const gs=d.games;
  const gpInGs=gs.filter(g=>g.summary&&g.summary.minutes&&(g.summary.minutes[pid]||0)>0).length;
  let h='<button class="back-btn" onclick="selPlayer=null;render();">← Pick a different player</button>';
  h+='<div class="p-player-card"><div style="display:flex;align-items:baseline;gap:8px;"><span class="p-player-num">'+num+'</span><span class="p-player-name">'+name+'</span></div>';
  h+='<div class="p-player-team">'+d.team.full+'  ·  '+gpInGs+' game'+(gpInGs===1?'':'s')+' played</div></div>';
  if(gpInGs<4){
    h+='<div class="card"><div class="sec-h">Season so far</div><div style="font-size:13px;color:var(--ink2);padding:4px 0;">Trend data is available from 4 games. Head to <strong>My Player</strong> for '+name.split(' ')[0]+'\'s game-by-game stats.</div></div>';
    return h;
  }
  const first=name.split(' ')[0];

  // ── helpers ──────────────────────────────────────────
  const r1=v=>Math.round(v*10)/10;
  const arcOf=(vals)=>{
    const a3=metricArc(vals,3),a5=metricArc(vals,5);
    return{a3,a5,conf:!!(a3&&a5&&a3.dir===a5.dir&&a3.dir!=='flat'),latest:vals.length?r1(vals[vals.length-1]):0};
  };

  // ── build arc objects ─────────────────────────────────
  const ptsVals=gs.map(g=>(g.summary.stats[pid]||{}).pts||0);
  const rebVals=gs.map(g=>{const s=g.summary.stats[pid]||{};return(s.oreb||0)+(s.dreb||0);});
  const astVals=gs.map(g=>(g.summary.stats[pid]||{}).ast||0);
  const minVals=gs.map(g=>+(g.summary.minutes[pid]||0).toFixed(1));
  const defVals=gs.map(g=>{const s=g.summary.stats[pid]||{};return(s.stl||0)+(s.blk||0);});
  const tovVals=gs.map(g=>(g.summary.stats[pid]||{}).tov||0);
  const ptsArc=arcOf(ptsVals),rebArc=arcOf(rebVals),astArc=arcOf(astVals);
  const minArc=arcOf(minVals),defArc=arcOf(defVals),tovArc=arcOf(tovVals);

  // ── team averages per game played (for proximity logic) ──
  const teamAvg=(statFn)=>{
    const vals=allPlayers.filter(p=>p.gp>0).map(p=>{
      let tot=0;gs.forEach(g=>{const s=g.summary.stats[p.pid]||{};tot+=statFn(s);});return p.gp>0?tot/p.gp:0;
    });
    return vals.length?r1(vals.reduce((s,v)=>s+v,0)/vals.length):0;
  };
  const teamPtsPG=teamAvg(s=>s.pts||0);
  const teamRebPG=teamAvg(s=>(s.oreb||0)+(s.dreb||0));
  const teamAstPG=teamAvg(s=>s.ast||0);
  const pPtsPG=a.gp>0?r1(a.pts/a.gp):0;
  const pRebPG=a.gp>0?r1((a.oreb+a.dreb)/a.gp):0;
  const pAstPG=a.gp>0?r1(a.ast/a.gp):0;
  const pMinPG=a.gp>0?r1(a.min/a.gp):0;
  const pTovPG=a.gp>0?r1(a.tov/a.gp):0;

  // ── WHAT'S GROWING ─────────────────────────────────────
  // Build stat lines: only include if arc is up
  const growRows=[];
  const fmt=(early,late,unit,conf)=>'<strong>'+early+(unit||'')+' → '+late+(unit||'')+'</strong> over the last 3 games'+(conf?' <span style="font-size:11px;color:var(--windk);">(holds across 5)</span>':'');
  if(ptsArc.a3&&ptsArc.a3.dir==='up')growRows.push({label:'Points',detail:fmt(ptsArc.a3.early,ptsArc.a3.late,'',ptsArc.conf)});
  if(rebArc.a3&&rebArc.a3.dir==='up')growRows.push({label:'Rebounds',detail:fmt(rebArc.a3.early,rebArc.a3.late,'',rebArc.conf)});
  if(astArc.a3&&astArc.a3.dir==='up')growRows.push({label:'Assists',detail:fmt(astArc.a3.early,astArc.a3.late,'',astArc.conf)});
  if(defArc.a3&&defArc.a3.dir==='up')growRows.push({label:'Steals + blocks',detail:fmt(defArc.a3.early,defArc.a3.late,'',defArc.conf)});
  if(minArc.a3&&minArc.a3.dir==='up')growRows.push({label:'Minutes',detail:fmt(minArc.a3.early,minArc.a3.late,' min',minArc.conf)});

  h+='<div class="card" style="border-left:3px solid var(--win);"><div class="sec-h" style="color:var(--windk);">📈 What\'s moving up</div>';
  if(growRows.length){
    h+='<div style="display:flex;flex-direction:column;gap:7px;">';
    growRows.forEach(r=>{
      h+='<div style="font-size:13px;color:var(--ink2);"><span style="font-weight:600;min-width:120px;display:inline-block;">'+r.label+'</span> '+r.detail+'</div>';
    });
    h+='</div>';
  }else{
    // No upward movement — check for flat (consistency) or general no-signal
    const flatStats=[];
    if(ptsArc.a3&&ptsArc.a3.dir==='flat')flatStats.push('points ('+pPtsPG+'/game)');
    if(rebArc.a3&&rebArc.a3.dir==='flat')flatStats.push('rebounds ('+pRebPG+'/game)');
    if(minArc.a3&&minArc.a3.dir==='flat')flatStats.push('minutes ('+pMinPG+'/game)');
    if(flatStats.length){
      h+='<div style="font-size:13px;color:var(--ink2);">'+first+'\'s stats have been consistent across the last 3 games: '+flatStats.join(', ')+'. No upward movement yet in this window.</div>';
    }else{
      h+='<div style="font-size:13px;color:var(--ink2);">No clear upward movement across the last 3 games. Check the arc charts below for the full season picture.</div>';
    }
  }
  h+='</div>';

  // ── NEXT FOCUS ──────────────────────────────────────────
  // Priority: 1) confirmed rising turnovers  2) confirmed dropping minutes  3) proximity to team average on a key stat
  h+='<div class="card" style="border-left:3px solid var(--maple);"><div class="sec-h" style="color:var(--amber);">🎯 Next focus</div>';
  let focusHtml='';
  if(tovArc.a3&&tovArc.a3.dir==='up'&&tovArc.conf){
    focusHtml='<div style="font-size:13px;color:var(--ink2);">Turnovers: <strong>'+tovArc.a3.early+' → '+tovArc.a3.late+' per game</strong> over the last 5 games. Ball security is the stat most directly in '+first+'\'s control.</div>';
  }else if(minArc.a3&&minArc.a3.dir==='down'&&minArc.conf){
    focusHtml='<div style="font-size:13px;color:var(--ink2);">Minutes have dropped from <strong>'+minArc.a3.early+' → '+minArc.a3.late+' per game</strong> across the last 5 games. Worth raising with the coach to understand rotation plans.</div>';
  }else{
    // Find the stat where she's closest to the team average from below — that's the next threshold
    const gaps=[
      {label:'rebounds',pg:pRebPG,team:teamRebPG,unit:''},
      {label:'points',pg:pPtsPG,team:teamPtsPG,unit:''},
      {label:'assists',pg:pAstPG,team:teamAstPG,unit:''}
    ].filter(x=>x.team>0&&x.pg<x.team).map(x=>({...x,gap:x.team-x.pg})).sort((a,b)=>a.gap-b.gap);
    if(gaps.length){
      const g=gaps[0];
      focusHtml='<div style="font-size:13px;color:var(--ink2);">'+first+' is averaging <strong>'+g.pg+g.unit+' '+g.label+' per game</strong>. Team average is <strong>'+g.team+g.unit+'</strong> — a gap of '+r1(g.gap)+'.</div>';
    }else{
      // She's at or above team average on everything measured — show her best stat vs her season high
      const ptsHigh=Math.max(...ptsVals,0);
      focusHtml='<div style="font-size:13px;color:var(--ink2);">No gaps flagged below team average. '+first+'\'s season high is <strong>'+ptsHigh+' points</strong> in a game — consistency toward that level is the next marker.</div>';
    }
  }
  h+=focusHtml+'</div>';

  // ── ARC CHARTS ─────────────────────────────────────────
  h+='<div class="card"><div class="sec-h">'+first+'\'s season arc &nbsp;·&nbsp; <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;color:var(--muted);">all games · smoothed trend line</span></div>';
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;">';
  h+='<div class="chart-card"><h4>Minutes per game</h4>'+lineChart(gs,g=>+(g.summary.minutes[pid]||0).toFixed(1),'#5a6472')+'</div>';
  h+='<div class="chart-card"><h4>Points per game</h4>'+lineChart(gs,g=>(g.summary.stats[pid]||{}).pts||0,'#1a9e72')+'</div>';
  h+='<div class="chart-card"><h4>Rebounds per game</h4>'+lineChart(gs,g=>{const s=g.summary.stats[pid]||{};return(s.oreb||0)+(s.dreb||0);},'#2d6fb5')+'</div>';
  h+='<div class="chart-card"><h4>Assists per game</h4>'+lineChart(gs,g=>(g.summary.stats[pid]||{}).ast||0,'#7c4dcc')+'</div>';
  h+='</div></div>';
  return h;
}

      else if(curView==='progression')h+=vProgressionCoach(d);
      else if(curView==='rotation')h+=vRotation(d);
      else h+=vOpposition(d);

      else if(curView==='overview')h+=vOverview(d);

  }

const COACH_STORE_KEY='courttrack_coach_dar121';

  const h=await sha256Hex(code);
  if(h!==COACH_CODE_HASH){err.textContent='Incorrect passcode.';return;}
  try{localStorage.setItem(COACH_STORE_KEY,JSON.stringify({h:h}));}catch(e){}
  showCoachApp();
  render(true);
}
document.getElementById('coach-unlock-btn').addEventListener('click',attemptCoachUnlock);
document.getElementById('coach-code-input').addEventListener('keydown',e=>{if(e.key==='Enter')attemptCoachUnlock();});
async function sha256Hex(str){
  const enc=new TextEncoder().encode(str.trim().toUpperCase());
  const buf=await crypto.subtle.digest('SHA-256',enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function checkStoredCoachUnlock(){
  try{
    if(window.__ADMIN_BYPASS__){
      showCoachApp();render(true);return true;
    }
    const saved=JSON.parse(localStorage.getItem(COACH_STORE_KEY)||'null');
    if(saved&&saved.h===COACH_CODE_HASH){
      showCoachApp();render(true);return true;
    }
  }catch(e){}
  return false;
}
checkStoredCoachUnlock();
</script>
