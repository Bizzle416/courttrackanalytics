<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard closed | CourtTrack Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#101d31;--gold:#d9a05b;--ink:#344152;--muted:#7c8698;--line:#e8e6e1;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--navy);display:flex;align-items:center;justify-content:center;padding:24px;
  font-family:'Inter',-apple-system,'Segoe UI',sans-serif;}
.card{background:#fff;border-radius:14px;padding:40px 32px;max-width:400px;width:100%;text-align:center;}
.logo{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:24px;color:var(--navy);margin-bottom:20px;}
.logo span{color:var(--gold);}
h1{font-size:19px;color:var(--navy);margin:0 0 10px;font-weight:600;}
p{font-size:14px;line-height:1.55;color:var(--ink);margin:0 0 24px;}
a.btn{display:inline-block;padding:12px 22px;border-radius:8px;background:var(--navy);color:#fff;
  text-decoration:none;font-size:14px;font-weight:600;}
a.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}
.small{margin-top:18px;font-size:12px;color:var(--muted);}
.small a{color:var(--muted);}
</style>
</head>
<body>
<main class="card">
  <div class="logo">Court<span>Track</span></div>
  <h1>This dashboard is closed</h1>
  <p>Darebin 12.1 analytics were available for the 2026 season, which has now finished. Access has been closed ahead of the new season.</p>
  <a class="btn" href="/">Go to CourtTrack Analytics</a>
  <div class="small">Questions? Contact us via <a href="https://www.instagram.com/courttrack">@courttrack</a>.</div>
</main>
</body>
</html>
